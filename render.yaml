# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> select this repo
services:
  - type: web
    name: fraud-detection-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /
    # APP_ENV is deliberately unset: the backend then runs in production mode and
    # refuses to boot with a placeholder/weak SECRET_KEY or ADMIN_PASSWORD.
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # set this yourself (12+ characters)
      - key: ALLOWED_ORIGINS
        sync: false          # your Vercel URL; dashboard edits survive Blueprint syncs
      - key: DATABASE_URL
        value: sqlite:///./fraud_detection.db
